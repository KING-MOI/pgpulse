[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgpulse"
version = "0.1.0.dev0"
description = "Health-check CLI for Postgres"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aditya Verma" }]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pgpulse"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
